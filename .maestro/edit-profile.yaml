appId: com.barberclick.app
env:
  EMAIL: email@email.com
  SENHA: "123456"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar / Cadastrar.*"
    timeout: 60000
- tapOn: "Entrar / Cadastrar.*"
- assertVisible: "Fazer Login"
- tapOn: "E-mail"
- inputText: ${EMAIL}
- tapOn: "Senha"
- inputText: ${SENHA}
- pressKey: Enter
- tapOn: "Entrar"
- tapOn:
    text: "Agora não"
    optional: true
- tapOn: "Perfil.*"
- assertVisible:
    id: "change-password-button"
- tapOn:
    id: "edit-email-row"
- assertVisible: "Alterar e-mail"
- assertVisible: "Novo e-mail"
- assertVisible: "Salvar"
- tapOn: "Cancelar"
