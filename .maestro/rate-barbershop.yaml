appId: com.barberclick.app
env:
  EMAIL: email@email.com
  SENHA: "123456"
  BARBEARIA: "Ian' Barbershop"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar / Cadastrar.*"
    timeout: 60000
- tapOn: "Entrar / Cadastrar.*"
- assertVisible: "Fazer Login"
- tapOn: "E-mail"
- inputText: ${EMAIL}
- tapOn: "Senha"
- inputText: ${SENHA}
- pressKey: Enter
- tapOn: "Entrar"
- tapOn:
    text: "Agora não"
    optional: true
- extendedWaitUntil:
    visible:
      text: "${BARBEARIA}.*"
    timeout: 30000
- tapOn:
    text: "${BARBEARIA}.*"
- assertVisible: "Avaliar"
- tapOn:
    id: "rate-5"
- assertVisible: "Avaliação registrada"
- tapOn: "OK"
